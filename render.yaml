services:
  - type: web
    name: civicheat-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: FORTYGUARD_BASE_URL
        value: https://api.fortyguard.com
      - key: NEMOTRON_BASE_URL
        sync: false
      - key: NEMOTRON_API_KEY
        sync: false
      - key: NEMOTRON_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
